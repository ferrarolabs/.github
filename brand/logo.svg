<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ferrarolabs mark: the periodic-table tile for iron (Fe, 26) followed by a
       terminal block cursor glowing like hot metal.
       Ferraro = the smith; labs = the laboratory; the cursor = where the agents work.
       The avatar itself is the tile, so the symbol can be as large as possible. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F25"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB15A"/>
      <stop offset="0.55" stop-color="#FF6A2B"/>
      <stop offset="1" stop-color="#D9381E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- atomic number -->
  <text x="150" y="236" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="600"
        font-size="104" fill="#FF7A3A" letter-spacing="2">26</text>

  <!-- symbol -->
  <text x="140" y="716" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="700"
        font-size="500" fill="#F2EEE8" letter-spacing="-10">Fe</text>

  <!-- block cursor, hot like iron from the forge -->
  <rect x="688" y="362" width="186" height="354" rx="10" fill="url(#ember)" filter="url(#glow)"/>

  <!-- atomic mass -->
  <text x="150" y="872" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="400"
        font-size="62" fill="#F2EEE8" fill-opacity="0.42" letter-spacing="4">55.845</text>
</svg>
